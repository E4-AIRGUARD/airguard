name: Dashboard checks

on:
  pull_request:
    paths:
      - 'embedded/dashboard/**'
      - '.github/workflows/dashboard-checks.yml'
  push:
    branches: [main]
    paths:
      - 'embedded/dashboard/**'
      - '.github/workflows/dashboard-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-checks:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: embedded/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-control.txt
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Check JavaScript syntax
        run: for file in dist/*.js; do node --check "$file"; done
      - name: Check event interactions and calculations
        run: node tests/dashboard.cjs
      - name: Check local preview server syntax
        run: python3 -m py_compile run.py
      - name: Check sensors, arbitration, persistence and fan leases
        run: python tests/run_all.py
